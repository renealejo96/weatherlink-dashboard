<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ station.name }} - Detalle</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.0.0/cdn.min.js"></script>
    
    <!-- Custom Theme Styling & Chart Defaults -->
    <link rel="stylesheet" href="/static/css/theme.css">
    <script src="/static/js/chart-theme.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom mb-5">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">
                <i class="fas fa-cloud-sun me-2 text-primary"></i> <strong>Florsani</strong>
            </a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-chart-pie me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/rain/events"><i class="fas fa-tint me-1"></i> Lluvia</a></li>
                    <li class="nav-item"><a class="nav-link" href="/compare"><i class="fas fa-balance-scale me-1"></i> Comparativa</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-white mb-2"><i class="fas fa-broadcast-tower text-info"></i> {{ station.name }}</h1>
            <p class="lead text-light opacity-75">ID de Estación: <span class="badge bg-secondary rounded-pill bg-opacity-25">{{ station.station_id }}</span></p>
        </div>

        <div class="glass-card p-4 mb-4">
            <h4 class="mb-3 fs-5 fw-bold text-light"><i class="fas fa-filter text-primary me-2"></i> Filtros de Fecha y Exportación</h4>
            <div class="row align-items-end g-3">
                <div class="col-md-3">
                    <label class="form-label text-white-50" style="font-size: 0.85rem;">Rango Rápido</label>
                    <select class="form-select" id="quickRange">
                        <option value="1">Último día</option>
                        <option value="7" selected>Últimos 7 días</option>
                        <option value="15">Últimos 15 días</option>
                        <option value="30">Último mes</option>
                        <option value="custom">Seleccionar Fechas</option>
                    </select>
                </div>
                <div class="col-md-2" id="startDateContainer" style="display: none;">
                    <label class="form-label text-white-50" style="font-size: 0.85rem;">Fecha Inicio</label>
                    <input type="date" class="form-control" id="startDate">
                </div>
                <div class="col-md-2" id="endDateContainer" style="display: none;">
                    <label class="form-label text-white-50" style="font-size: 0.85rem;">Fecha Fin</label>
                    <input type="date" class="form-control" id="endDate">
                </div>
                <div class="col-md-2" id="updateButtonContainer" style="display: none;">
                    <button class="btn-custom w-100 py-2.5" onclick="loadData()">
                        <i class="fas fa-sync-alt"></i> Actualizar
                    </button>
                </div>
                <div class="col-md-3 ms-auto">
                    <button class="btn-outline-custom w-100 py-2.5" onclick="exportToExcel()">
                        <i class="fas fa-file-excel text-success"></i> Exportar a Excel
                    </button>
                </div>
                <div class="col-12" id="loadingIndicator" style="display: none;">
                    <div class="alert border-0 bg-info bg-opacity-10 text-info d-flex align-items-center rounded-3 mb-0 mt-2">
                        <i class="fas fa-spinner fa-spin me-2 fs-5"></i> Descargando registros de la estación...
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="glass-card p-4" style="height: 380px;">
                    <h5 class="fs-6 fw-bold text-light mb-3"><i class="fas fa-thermometer-half text-danger me-2"></i> Temperatura</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="tempChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card p-4" style="height: 380px;">
                    <h5 class="fs-6 fw-bold text-light mb-3"><i class="fas fa-tint text-primary me-2"></i> Humedad</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="humidityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mt-1">
            <div class="col-md-6">
                <div class="glass-card p-4" style="height: 380px;">
                    <h5 class="fs-6 fw-bold text-light mb-3"><i class="fas fa-wind text-info me-2"></i> Velocidad del Viento</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="windChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card p-4" style="height: 380px;">
                    <h5 class="fs-6 fw-bold text-light mb-3"><i class="fas fa-cloud-rain text-secondary me-2"></i> Precipitación</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="rainChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mt-1 mb-5">
            <div class="col-md-6">
                <div class="glass-card p-4" style="height: 380px;">
                    <h5 class="fs-6 fw-bold text-light mb-3"><i class="fas fa-sun text-warning me-2"></i> Radiación Solar</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="solarChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card p-4" style="height: 380px;">
                    <h5 class="fs-6 fw-bold text-light mb-3"><i class="fas fa-chart-line text-success me-2"></i> DPV (Déficit de Presión de Vapor)</h5>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="pressureChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const stationKey = '{{ station_key }}';
        let charts = {};

        // Configurar fechas por defecto
        const today = new Date();
        const weekAgo = new Date(today);
        weekAgo.setDate(weekAgo.getDate() - 7);
        
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = weekAgo;

        // Crear gráficos
        function createChart(ctx, label, color) {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: label,
                        data: [],
                        borderColor: color,
                        backgroundColor: ChartTheme.getGradient(ctx, color),
                        borderWidth: 2.5,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0,
                        pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        x: ChartTheme.getAxisConfig('Fecha/Hora'),
                        y: ChartTheme.getAxisConfig(label)
                    }
                }
            });
        }

        // Inicializar gráficos
        charts.temp = createChart(document.getElementById('tempChart'), 'Temperatura (°C)', '#f97316');
        charts.humidity = createChart(document.getElementById('humidityChart'), 'Humedad (%)', '#06b6d4');
        charts.wind = createChart(document.getElementById('windChart'), 'Viento (km/h)', '#3b82f6');
        
        // Gráfico de lluvia como barras
        charts.rain = new Chart(document.getElementById('rainChart'), {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Lluvia (mm)',
                    data: [],
                    backgroundColor: '#8b5cf699',
                    borderColor: '#8b5cf6',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: true, position: 'top' }
                },
                scales: {
                    x: ChartTheme.getAxisConfig('Fecha/Hora'),
                    y: ChartTheme.getAxisConfig('Lluvia (mm)', true)
                }
            }
        });
        
        charts.solar = createChart(document.getElementById('solarChart'), 'Radiación Solar (W/m²)', '#f59e0b');
        charts.pressure = createChart(document.getElementById('pressureChart'), 'DPV (kPa)', '#10b981');

        // Mostrar/ocultar selectores de fecha
        document.getElementById('quickRange').addEventListener('change', function() {
            const value = this.value;
            const showCustom = value === 'custom';
            
            document.getElementById('startDateContainer').style.display = showCustom ? 'block' : 'none';
            document.getElementById('endDateContainer').style.display = showCustom ? 'block' : 'none';
            document.getElementById('updateButtonContainer').style.display = showCustom ? 'block' : 'none';
            
            // Si no es custom, cargar automáticamente
            if (!showCustom) {
                loadData();
            }
        });

        // Cargar datos
        async function loadData() {
            const quickRange = document.getElementById('quickRange').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            // Mostrar indicador de carga
            document.getElementById('loadingIndicator').style.display = 'block';

            let url = `/api/historical/${stationKey}?`;
            
            if (quickRange === 'custom' && startDate && endDate) {
                url += `start_date=${startDate}&end_date=${endDate}`;
            } else if (quickRange !== 'custom') {
                url += `days=${quickRange}`;
            } else {
                document.getElementById('loadingIndicator').style.display = 'none';
                alert('Por favor seleccione fecha de inicio y fin');
                return;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                const records = data.records || [];
                
                // Preparar datos para gráficos
                const labels = records.map(r => new Date(r.timestamp * 1000).toLocaleString('es-ES', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }));
                
                // Convertir unidades a métricas
                const tempC = records.map(r => r.temperature ? ((r.temperature - 32) * 5 / 9) : null);
                const windKmh = records.map(r => r.wind_speed ? (r.wind_speed * 1.60934) : null);
                const rainMm = records.map(r => (r.rain_mm ?? r.rain ?? null));
                const vpd = records.map(r => {
                    if (r.temperature && r.humidity) {
                        const tc = (r.temperature - 32) * 5 / 9;
                        const vpsat = 0.6108 * Math.exp((17.27 * tc) / (tc + 237.3));
                        const vpactual = (r.humidity / 100) * vpsat;
                        return vpsat - vpactual;
                    }
                    return null;
                });
                
                // Filtrar solo días con lluvia para el gráfico de precipitación
                const rainData = records
                    .map((r, idx) => ({
                        label: labels[idx],
                        value: rainMm[idx]
                    }))
                    .filter(d => d.value > 0);
                
                const rainLabels = rainData.map(d => d.label);
                const rainValues = rainData.map(d => d.value);
                
                // Actualizar cada gráfico
                updateChart(charts.temp, labels, tempC);
                updateChart(charts.humidity, labels, records.map(r => r.humidity));
                updateChart(charts.wind, labels, windKmh);
                updateChart(charts.rain, rainLabels, rainValues);
                updateChart(charts.solar, labels, records.map(r => r.solar_radiation));
                updateChart(charts.pressure, labels, vpd);

                // Ocultar indicador de carga
                document.getElementById('loadingIndicator').style.display = 'none';

            } catch (error) {
                document.getElementById('loadingIndicator').style.display = 'none';
                alert('Error al cargar datos: ' + error.message);
            }
        }

        function updateChart(chart, labels, data) {
            chart.data.labels = labels;
            chart.data.datasets[0].data = data;
            const dataset = chart.data.datasets[0];
            if (chart.config.type === 'line' && dataset.borderColor) {
                dataset.backgroundColor = ChartTheme.getGradient(chart.ctx, dataset.borderColor);
            }
            chart.update();
        }

        // Exportar a Excel
        function exportToExcel() {
            const quickRange = document.getElementById('quickRange').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            let url = `/api/export/${stationKey}?`;
            
            if (quickRange === 'custom' && startDate && endDate) {
                url += `start_date=${startDate}&end_date=${endDate}`;
            } else if (quickRange !== 'custom') {
                url += `days=${quickRange}`;
            } else {
                alert('Por favor seleccione fecha de inicio y fin');
                return;
            }
            
            // Descargar archivo
            window.location.href = url;
        }

        // Cargar datos iniciales
        loadData();
    </script>
</body>
</html>
