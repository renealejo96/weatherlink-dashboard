version: '3.8'

name: weatherlink_prod

services:
  # Redpanda (Broker Kafka de alto rendimiento en C++)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: weatherlink_redpanda_prod
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "127.0.0.1:${REDPANDA_DEBUG_PORT:-19092}:9092"
    volumes:
      - redpanda_data_prod:/var/lib/redpanda/data
    networks:
      - weatherlink_prod_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Redpanda Console (Gestor de tópicos - Solo loopback)
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.0
    container_name: weatherlink_console_prod
    depends_on:
      - redpanda
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-18082}:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    networks:
      - weatherlink_prod_net
    restart: unless-stopped

  # Ingestor Polling WeatherLink v2 -> Kafka
  kafka-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherlink_producer_prod
    restart: unless-stopped
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_TOPIC_RAW=weatherlink.raw
    command: python kafka_producer.py
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - weatherlink_prod_net
    volumes:
      - ./logs:/app/logs

  # Redis para Persistencia de Estados en Memoria Rápida (100% privado en su red)
  redis:
    image: redis:7-alpine
    container_name: weatherlink_redis_prod
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - weatherlink_prod_net
    volumes:
      - redis_data_prod:/data

  # Consumidor Asíncrono de Telemetría (Kafka -> Supabase weather_readings)
  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherlink_streaming_prod
    restart: unless-stopped
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_TOPIC_RAW=weatherlink.raw
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    command: python consumer_weather_to_supabase.py
    depends_on:
      - kafka-producer
    networks:
      - weatherlink_prod_net
    volumes:
      - ./logs:/app/logs

  # Motor Asíncrono de Alertas y Eventos de Lluvia con Redis
  rain-alerts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherlink_rain_alerts_prod
    restart: unless-stopped
    env_file: .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - KAFKA_TOPIC_RAW=weatherlink.raw
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=redis://redis:6379/0
    command: python consumer_rain_alerts.py
    depends_on:
      - kafka-producer
      - redis
    networks:
      - weatherlink_prod_net
    volumes:
      - ./logs:/app/logs

  # Monitor de Cierre de Eventos Inactivos de Lluvia (cada 10 min)
  rain-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherlink_rain_monitor_prod
    restart: unless-stopped
    env_file: .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    command: python close_old_rain_events.py 30 --loop 10
    depends_on:
      - rain-alerts
    networks:
      - weatherlink_prod_net
    volumes:
      - ./logs:/app/logs

  # Servidor Web Flask con Gunicorn
  # Expuesto directamente en 127.0.0.1:8090 para el Nginx principal del VPS
  weatherlink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherlink_app_prod
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${HOST_PORT:-8090}:8000"
    networks:
      - weatherlink_prod_net
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx en contenedor deshabilitado (el VPS ya usa su propio Nginx en el host)
  nginx:
    image: nginx:alpine
    container_name: weatherlink_nginx_prod
    profiles:
      - internal_proxy_only
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - weatherlink
    networks:
      - weatherlink_prod_net

networks:
  weatherlink_prod_net:
    name: weatherlink_prod_net
    driver: bridge

volumes:
  redpanda_data_prod:
    name: weatherlink_redpanda_data_prod
    driver: local
  redis_data_prod:
    name: weatherlink_redis_data_prod
    driver: local
