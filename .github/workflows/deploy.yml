name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            # 1. Navegar al directorio del proyecto en Hostinger (detecta /root o /var/www)
            if [ -d "/root/weatherlink-dashboard" ]; then
              cd /root/weatherlink-dashboard
            elif [ -d "/var/www/weatherlink" ]; then
              cd /var/www/weatherlink
            else
              echo "Directorio no encontrado" && exit 1
            fi
            
            # 2. Descargar los últimos cambios desde GitHub
            git pull origin main
            
            # 3. Dar permisos de ejecución y correr el script de despliegue
            chmod +x deploy-hostinger.sh
            sudo ./deploy-hostinger.sh
            
            echo "¡Despliegue completado exitosamente!"
